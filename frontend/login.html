<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — HW Store</title>
    <link rel="stylesheet" href="css/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="announcement-bar">
      <div class="announcement-bar__content">
        <span>300% advance payment for order confirmation</span>
        <span aria-hidden="true">•</span>
        <span>300% advance payment for order confirmation</span>
      </div>
    </div>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"
          ><img src="images/logo.png" alt="HW Store logo" /><span
            >HW Store</span
          ></a
        >
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About</a></li>
        </ul>
      </div>
    </nav>

    <section class="login-section">
      <div class="container">
        <div class="auth-card">
          <div class="auth-icon">🔐</div>
          <h1>Admin Access</h1>
          <p>Enter your credentials to manage the collection.</p>
          <form id="loginForm" method="get" action="/admin.html">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@hwstore.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-input">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Toggle password visibility"
                >
                  👁
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="loginBtn"
            >
              Access Panel
            </button>
          </form>
          <div
            class="login-extra"
            id="createAdminSection"
            style="display: none; margin-top: 1rem; text-align: center"
          >
            <p>No admin account exists yet.</p>
            <a href="signup.html" class="btn btn-secondary btn-full"
              >Create Admin Account</a
            >
          </div>
          <div
            id="loginAlert"
            class="alert"
            style="display: none; margin-top: 1rem"
          ></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 HW Store. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script>
      const API_URL = window.location.origin + "/api/auth";
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const loginAlert = document.getElementById("loginAlert");
      const createAdminSection = document.getElementById("createAdminSection");

      document.addEventListener("DOMContentLoaded", () => {
        const passwordInputField = document.getElementById("password");
        const toggleButton = document.querySelector(".password-toggle");
        if (passwordInputField && toggleButton) {
          toggleButton.addEventListener("click", () => {
            const isHidden = passwordInputField.type === "password";
            passwordInputField.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "🙈" : "👁";
            toggleButton.setAttribute(
              "aria-label",
              isHidden ? "Hide password" : "Show password",
            );
          });
        }

        checkAdminExists();
      });

      function showAlert(message, type = "error") {
        loginAlert.textContent = message;
        loginAlert.className = `alert alert-${type}`;
        loginAlert.style.display = "block";
        if (type !== "error") {
          loginAlert.style.borderColor = "var(--gold)";
          loginAlert.style.background = "rgba(250, 234, 184, 0.2)";
          loginAlert.style.color = "var(--black)";
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        loginAlert.style.display = "none";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert("Please enter both email and password.");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        try {
          const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (!response.ok) {
            showAlert(data.message || "Login failed.");
            return;
          }
          window.location.href = "admin.html";
        } catch (error) {
          showAlert("Network error. Please try again later.");
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Access Panel";
        }
      }

      async function checkAdminExists() {
        try {
          const response = await fetch(`${API_URL}/check-admin`);
          const data = await response.json();
          if (!response.exists) {
            createAdminSection.style.display = "block";
          } else {
            createAdminSection.style.display = "none";
          }
        } catch (error) {
          console.error("Check admin error:", error);
        }
      }

      loginForm.addEventListener("submit", handleLogin);
    </script>
  </body>
</html>
